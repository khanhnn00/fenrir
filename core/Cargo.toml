[package]
name = "fenrir_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
rusqlite = { version = "0.43", features = ["bundled"] }
portable-pty = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
